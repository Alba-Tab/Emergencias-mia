[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emergencias-ai"
version = "0.1.0"
description = "Microservicio de IA para análisis de emergencias"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic-settings>=2"
]

[tool.setuptools.packages.find]
include = ["app*"]
